spring.application.name=oms-backend

server.port=8080
server.servlet.context-path=/oms-backend

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/oms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.error.whitelabel.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# FILE UPLOAD
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT
jwt.secret=12345678901234567890123456789012345678901234567890
jwt.expiration=86400000

# ASYNC
spring.mvc.async.request-timeout=300000

# FILE STORAGE
file.upload-dir=E:/downloads/

tiles.base-path=${TILES_BASE_PATH:C:/oms-tiles}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
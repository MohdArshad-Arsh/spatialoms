spring.application.name=oms-backend

server.port=${SERVER_PORT:6065}
server.servlet.context-path=/oms-backend

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/oms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.error.whitelabel.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

# FILE UPLOAD
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT
jwt.secret=12345678901234567890123456789012345678901234567890
jwt.expiration=86400000

# ASYNC
spring.mvc.async.request-timeout=300000

# FILE STORAGE
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads/}

# MAP TILES
tiles.base-path=${TILES_BASE_PATH:/app/tiles}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://192.168.1.65:3009,http://localhost:3009}
services:
  mysql:
    image: mysql:8.0
    container_name: spatialoms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oms_db}
    ports:
      - "0.0.0.0:3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - spatialoms-net

  backend:
    build:
      context: .
      dockerfile: oms-backend/Dockerfile
    container_name: spatialoms-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 6065
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-oms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      CORS_ALLOWED_ORIGINS: http://${DEPLOY_HOST:-192.168.1.65}:3009,http://localhost:3009
      FILE_UPLOAD_DIR: /app/uploads
      TILES_BASE_PATH: /app/tiles
    ports:
      - "0.0.0.0:6065:6065"
    volumes:
      - uploads_data:/app/uploads
      - C:/oms-tiles/tiles:/app/tiles/tiles
      - C:/oms-tiles/Saudi_tiles:/app/tiles/Saudi_tiles
      - C:/oms-tiles/india_tiles:/app/tiles/india_tiles
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6065/oms-backend/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - spatialoms-net

  frontend:
    build:
      context: .
      dockerfile: Web/Dockerfile
      args:
        REACT_APP_API_URL: http://${DEPLOY_HOST:-192.168.1.65}:6065/oms-backend/
        REACT_APP_TILES_BASE: http://${DEPLOY_HOST:-192.168.1.65}:6065/oms-backend
        REACT_APP_BASENAME: /
        PUBLIC_URL: /
    container_name: spatialoms-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:3009:3009"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3009/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - spatialoms-net

networks:
  spatialoms-net:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
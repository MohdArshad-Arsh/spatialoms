version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - my_details
  - my_name
  - orders
  - order_events
  - vendors
  - sensors
  - users
  - aoi
  - clients
  - follow-up

entities:
  - order_status
  - name
  - payment_status

slots:
  name:
    type: text
    mappings:
      - type: from_entity
        entity: name

responses:
  # utter_sql_query:
  # - text: "hey, i am in sql generation :)"

  utter_greet:
  - text: "Hey! How are you?"

  utter_detail:
  - text: "yes, you are sameer khan !"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Spatial."

  utter_name:
  - text: nece to meet you {name} !.

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true


actions:
  - action_welcome_user
  - action_add_title
  - action_generate_sql

  - action: action_generate_sql

- rule: vendors sql
  steps:
  - intent: vendors
  - action: action_generate_sql

- rule: sensors sql
  steps:
  - intent: sensors
  - action: action_generate_sql

- rule: users sql
  steps:
  - intent: users
  - action: action_generate_sql

- rule: aoi sql
  steps:
  - intent: aoi
  - action: action_generate_sql

- rule: clients sql
  steps:
  - intent: clients
  - action: action_generate_sql

- rule: follow-up sql
  steps:
  - intent: follow-up
  - action: action_generate_sql
